<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Offres de stage</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f9f6; }
        .navbar {
            background: linear-gradient(135deg, #0f4c2a, #1a6b3c);
            padding: 14px 32px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #c9a84c;
        }
        .brand { color: #f0d080; font-size: 20px; font-weight: bold; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: rgba(240,208,128,0.85); text-decoration: none; font-size: 14px; }
        .nav-links a:hover { color: #f0d080; }
        .content { max-width: 800px; margin: 36px auto; padding: 0 20px; }
        h1 { text-align: center; color: #0f4c2a; font-size: 26px; margin-bottom: 28px; }
        .card {
            background: white; border-radius: 14px; padding: 24px;
            margin-bottom: 20px; border: 1px solid #d4e8db;
            border-left: 4px solid #c9a84c;
            box-shadow: 0 2px 10px rgba(15,76,42,0.08);
        }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card h3 { color: #0f4c2a; font-size: 18px; margin-bottom: 6px; }
        .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        .tag { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .tag-loc { background: #e8f5ee; color: #1a6b3c; }
        .tag-dur { background: #fdf8ec; color: #92400e; }
        .tag-comp { background: #d4e8db; color: #0f4c2a; }
        .desc { font-size: 14px; color: #555; margin-bottom: 14px; line-height: 1.6; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        .site-link { font-size: 13px; color: #1a6b3c; text-decoration: none; }
        .site-link:hover { text-decoration: underline; }
        .btn-postuler {
            padding: 10px 22px;
            background: linear-gradient(135deg, #1a6b3c, #c9a84c);
            color: white; border: none; border-radius: 8px;
            font-size: 14px; font-weight: bold; cursor: pointer; text-decoration: none;
        }
        .btn-postuler:hover { opacity: 0.9; }
        .qr { text-align: center; margin: 14px 0; }
        .qr img { width: 150px; height: 150px; border-radius: 10px; border: 3px solid #d4e8db; }
        .qr-text { font-size: 12px; color: #6b7280; margin-top: 6px; }
    </style>
</head>
<body>
<div class="navbar">
    <div class="brand">🌿 StageMaroc</div>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/candidatures">Candidatures</a>
        <a href="/profil">Profil</a>
        <a href="/logout">Déconnexion</a>
    </div>
</div>
<div class="content">
    <h1>Liste des stages</h1>
    <div th:each="i : ${internships}" class="card">
        <div class="card-header">
            <div>
                <h3 th:text="${i.title}"></h3>
                <div class="meta">
                    <span class="tag tag-comp" th:text="${i.company}"></span>
                    <span class="tag tag-loc" th:text="${i.location}"></span>
                    <span class="tag tag-dur" th:text="${i.duration}"></span>
                </div>
            </div>
        </div>
        <p class="desc" th:text="${i.description}"></p>
        <div class="qr">
            <img th:src="'data:image/png;base64,' + ${qrService.generateQRCode(i.website != null ? i.website : 'https://example.com')}"/>
            <p class="qr-text">Scanner pour visiter le site officiel</p>
        </div>
        <div class="card-footer">
            <a class="site-link" th:href="${i.website != null ? i.website : '#'}" target="_blank">🌐 Site officiel</a>
            <a class="btn-postuler" th:href="@{'/postuler/' + ${i.id}}">Postuler</a>
        </div>
    </div>
</div>
</body>
</html>
