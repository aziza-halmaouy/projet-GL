<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mes CV — StageMaroc</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: #f0f4f1; }

        .navbar {
            background: linear-gradient(135deg, #0f4c2a, #1a6b3c);
            padding: 14px 32px; display: flex;
            justify-content: space-between; align-items: center;
            border-bottom: 2px solid #c9a84c;
        }
        .brand { color: #f0d080; font-size: 20px; font-weight: bold; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: rgba(240,208,128,0.85); text-decoration: none; font-size: 14px; }
        .nav-links a:hover { color: #f0d080; }

        .content { max-width: 700px; margin: 36px auto; padding: 0 20px; }
        h1 { color: #0f4c2a; font-size: 22px; margin-bottom: 20px; }

        .card {
            background: white; border-radius: 14px; padding: 24px;
            border: 1px solid #d4e8db;
            box-shadow: 0 2px 8px rgba(15,76,42,0.06);
            margin-bottom: 16px;
        }

        .upload-zone { margin-bottom: 16px; }
        .upload-zone label {
            display: block; font-size: 13px; font-weight: bold;
            color: #1a6b3c; margin-bottom: 10px;
        }
        .upload-zone input[type="file"] {
            display: block; margin-bottom: 12px;
            font-size: 13px; color: #374151;
        }

        .btn {
            background: #1a6b3c; color: white;
            padding: 10px 20px; border: none;
            border-radius: 8px; cursor: pointer;
            font-size: 14px; font-weight: bold;
        }
        .btn:hover { background: #0f4c2a; }

        .cv-info {
            display: flex; align-items: center; gap: 14px;
            padding: 16px; background: #e8f5ee;
            border-radius: 10px; border: 1px solid #d4e8db;
            margin-top: 16px;
        }
        .cv-icon {
            font-size: 32px;
        }
        .cv-info h4 { font-size: 14px; color: #0f4c2a; margin-bottom: 4px; }
        .cv-info p { font-size: 12px; color: #6b7280; }
        .cv-link {
            display: inline-block; margin-top: 8px;
            background: #1a6b3c; color: white;
            padding: 7px 16px; border-radius: 7px;
            text-decoration: none; font-size: 13px; font-weight: bold;
        }
        .cv-link:hover { background: #0f4c2a; }

        .empty-state {
            text-align: center; padding: 30px;
            color: #9ca3af; font-size: 14px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="brand">🌿 StageMaroc</div>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/offres">Offres</a>
        <a href="/candidatures">Candidatures</a>
        <a href="/profil">Profil</a>
        <a href="/logout">Déconnexion</a>
    </div>
</div>

<div class="content">
    <h1>📄 Mes CV</h1>

    <!-- Upload -->
    <div class="card">
        <form th:action="@{/cv/upload}" method="post" enctype="multipart/form-data">
            <div class="upload-zone">
                <label>Uploader votre CV (PDF) :</label>
                <input type="file" name="cvFile" accept=".pdf,.doc,.docx">
            </div>
            <button type="submit" class="btn">📤 Envoyer</button>
        </form>
    </div>

    <!-- CV existant -->
    <div class="card" th:if="${user.cvData != null}">
        <div class="cv-info">
            <div class="cv-icon">📋</div>
            <div>
                <h4 th:text="${user.cvFileName}">mon_cv.pdf</h4>
                <p>CV enregistré avec succès</p>
                <a href="/cv/download" class="cv-link">📥 Télécharger mon CV</a>
            </div>
        </div>
    </div>

    <!-- Pas de CV -->
    <div class="card" th:if="${user.cvData == null}">
        <div class="empty-state">
            😕 Vous n'avez pas encore ajouté de CV.<br>
            <span style="font-size:12px;">Uploadez votre CV ci-dessus.</span>
        </div>
    </div>

</div>
</body>
</html>
