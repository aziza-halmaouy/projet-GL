<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mes CV — StageMaroc</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: #f0f4f1; }

        .navbar {
            background: linear-gradient(135deg, #0f4c2a, #1a6b3c);
            padding: 14px 32px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #c9a84c;
        }
        .brand { color: #f0d080; font-size: 20px; font-weight: bold; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: rgba(240,208,128,0.85); text-decoration: none; font-size: 14px; }
        .nav-links a:hover { color: #f0d080; }

        .content { max-width: 700px; margin: 36px auto; padding: 0 20px; }
        h1 { color: #0f4c2a; font-size: 22px; margin-bottom: 20px; }

        .card {
            background: white; border-radius: 14px; padding: 20px;
            border: 1px solid #d4e8db; box-shadow: 0 2px 8px rgba(15,76,42,0.06);
        }

        .btn {
            background: #1a6b3c; color: white; padding: 10px 16px;
            border: none; border-radius: 8px; cursor: pointer;
            font-size: 14px; font-weight: bold;
        }
        .btn:hover { background: #0f4c2a; }

        .cv-link {
            display: inline-block; margin-top: 12px;
            color: #1a6b3c; font-weight: bold; text-decoration: none;
        }
        .cv-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="navbar">
    <div class="brand">🌿 StageMaroc</div>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/offres">Offres</a>
        <a href="/candidatures">Candidatures</a>
        <a href="/profil">Profil</a>
        <a href="/logout">Déconnexion</a>
    </div>
</div>

<div class="content">
    <h1>📄 Mes CV</h1>
    <div class="card">
        <form th:action="@{/cv/upload}" method="post" enctype="multipart/form-data">
            <label for="cvFile">Uploader votre CV :</label><br><br>
            <input type="file" id="cvFile" name="cvFile" accept=".pdf,.doc,.docx">
            <button type="submit" class="btn">Envoyer</button>
        </form>

        <div th:if="${user.cvPath != null}">
            <p style="margin-top:20px;">Votre CV actuel :</p>
            <a th:href="@{'/cv/download/' + ${user.cvPath}}" class="cv-link">📥 Télécharger mon CV</a>
            <br><br>
            <!-- Affichage direct du PDF -->
            <embed th:src="@{'/cv/download/' + ${user.cvPath}}" type="application/pdf" width="100%" height="500px"/>
        </div>

        <div th:if="${user.cvPath == null}" style="margin-top:20px; color:#9ca3af;">
            😕 Vous n'avez pas encore ajouté de CV.
        </div>
    </div>
</div>
</body>
</html>
