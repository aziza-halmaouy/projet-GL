<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mes candidatures</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
            width: 600px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f9f9f9;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
            font-size: 16px;
            color: #555;
        }

        li span {
            font-weight: bold;
        }

        .status-attente {
            color: #FFD700;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #4facfe;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📑 Mes candidatures</h1>

    <ul>
        <li th:each="app : ${applications}">
            🎯 <span th:text="${app.internship.title}"></span> —
            <span th:text="${app.status}"
                  th:classappend="${app.status == 'En attente'} ? 'status-attente' : ''"></span>
        </li>
    </ul>

    <div class="links">
        <a href="/dashboard">🏠 Retour au tableau de bord</a>
    </div>
</div>

</body>
</html>
