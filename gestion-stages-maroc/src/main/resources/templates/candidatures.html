<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mes candidatures</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f9f6; }
        .navbar {
            background: linear-gradient(135deg, #0f4c2a, #1a6b3c);
            padding: 14px 32px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #c9a84c;
        }
        .brand { color: #f0d080; font-size: 20px; font-weight: bold; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: rgba(240,208,128,0.85); text-decoration: none; font-size: 14px; }
        .nav-links a:hover { color: #f0d080; }
        .content { max-width: 700px; margin: 36px auto; padding: 0 20px; }
        h1 { color: #0f4c2a; font-size: 22px; margin-bottom: 20px; }
        .empty { text-align: center; color: #9ca3af; font-size: 15px; padding: 40px; background: white; border-radius: 14px; border: 1px solid #d4e8db; }
        .card {
            background: white; border-radius: 14px; padding: 18px 22px;
            margin-bottom: 12px; display: flex; align-items: center; gap: 16px;
            border: 1px solid #d4e8db; border-left: 4px solid #c9a84c;
            box-shadow: 0 2px 8px rgba(15,76,42,0.06);
        }
        .logo {
            width: 48px; height: 48px; border-radius: 12px;
            background: linear-gradient(135deg, #1a6b3c, #c9a84c);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 20px; font-weight: bold; flex-shrink: 0;
        }
        .info { flex: 1; }
        .info h4 { font-size: 15px; font-weight: bold; color: #0f4c2a; margin-bottom: 3px; }
        .info p { font-size: 12px; color: #9ca3af; }
        .badge { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .b-wait { background: #fef9c3; color: #a16207; }
        .b-ok { background: #dcfce7; color: #15803d; }
        .b-no { background: #fee2e2; color: #b91c1c; }
        .footer-links { text-align: center; margin-top: 24px; }
        .footer-links a { color: #1a6b3c; text-decoration: none; margin: 0 12px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
<div class="navbar">
    <div class="brand">🌿 StageMaroc</div>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/offres">Offres</a>
        <a href="/profil">Profil</a>
        <a href="/logout">Déconnexion</a>
    </div>
</div>
<div class="content">
    <h1>📑 Mes candidatures</h1>
    <div class="empty" th:if="${#lists.isEmpty(applications)}">
        😕 Vous n'avez pas encore postulé à un stage.
        <br><br><a href="/offres" style="color:#1a6b3c;font-weight:bold;">Voir les offres disponibles</a>
    </div>
    <div th:each="app : ${applications}" class="card">
        <div class="logo" th:text="${#strings.substring(app.internship.company, 0, 1)}"></div>
        <div class="info">
            <h4 th:text="${app.internship.title}"></h4>
            <p th:text="${app.internship.company + ' · ' + app.internship.location + ' · ' + app.internship.duration}"></p>
        </div>
        <span th:text="${app.status}"
              th:class="${app.status == 'En attente'} ? 'badge b-wait' : (${app.status == 'Accepté'} ? 'badge b-ok' : 'badge b-no')"></span>
    </div>
    <div class="footer-links">
        <a href="/offres">💼 Voir les offres</a> |
        <a href="/dashboard">🏠 Tableau de bord</a>
    </div>
</div>
</body>
</html>
