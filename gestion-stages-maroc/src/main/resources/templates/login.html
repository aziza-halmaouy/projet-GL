<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Connexion</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f4c2a, #1a6b3c);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 36px 32px;
            border-radius: 16px;
            border: 1px solid #c9a84c;
            width: 380px;
            box-shadow: 0 8px 32px rgba(15,76,42,0.25);
        }
        .logo {
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, #1a6b3c, #c9a84c);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            font-size: 26px;
        }
        h1 { text-align: center; color: #0f4c2a; font-size: 22px; margin-bottom: 4px; }
        .subtitle { text-align: center; color: #6b7280; font-size: 13px; margin-bottom: 24px; }
        label { display: block; font-size: 11px; font-weight: bold; color: #1a6b3c; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        input {
            width: 100%; padding: 11px 14px; margin-bottom: 16px;
            border: 1.5px solid #d4e8db; border-radius: 8px;
            font-size: 14px; color: #0f4c2a; background: #f5f9f6;
        }
        input:focus { border-color: #1a6b3c; outline: none; }
        button {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #1a6b3c, #c9a84c);
            border: none; border-radius: 8px;
            color: white; font-size: 15px; font-weight: bold;
            cursor: pointer; margin-top: 4px;
        }
        button:hover { opacity: 0.92; }
        .error { color: #b91c1c; text-align: center; margin-bottom: 12px; font-size: 13px; background: #fee2e2; padding: 8px; border-radius: 6px; }
        .success { color: #15803d; text-align: center; margin-bottom: 12px; font-size: 13px; background: #dcfce7; padding: 8px; border-radius: 6px; }
        .links { text-align: center; margin-top: 18px; font-size: 13px; color: #6b7280; }
        .links a { color: #1a6b3c; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">🌿</div>
    <h1>Bon retour !</h1>
    <p class="subtitle">Connectez-vous à votre espace stages</p>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <p class="success" th:if="${param.registered}">✅ Compte créé ! Connectez-vous.</p>
    <form action="/login" method="post">
        <label>Email</label>
        <input type="email" name="email" placeholder="votre@email.com" required>
        <label>Mot de passe</label>
        <input type="password" name="password" placeholder="••••••••" required>
        <button type="submit">Se connecter</button>
    </form>
    <div class="links">Pas de compte ? <a href="/register">S'inscrire</a></div>
</div>
</body>
</html>
