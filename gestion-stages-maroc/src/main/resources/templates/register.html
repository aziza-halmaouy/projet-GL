<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inscription</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
            width: 350px;
        }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        input:focus { border-color: #4facfe; outline: none; }
        button {
            width: 100%;
            padding: 12px;
            background: #4facfe;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #00c6fb; }
        .error { color: red; text-align: center; margin-bottom: 10px; font-size: 14px; }
        .extra-links { text-align: center; margin-top: 15px; }
        .extra-links a { color: #4facfe; text-decoration: none; font-size: 14px; }
        .extra-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="login-container">
    <h1>📝 Inscription</h1>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <form action="/register" method="post">
        <label>👤 Nom :</label>
        <input type="text" name="nom" placeholder="Entrez votre nom" required>
        <label>👤 Prénom :</label>
        <input type="text" name="prenom" placeholder="Entrez votre prénom" required>
        <label>📧 Email :</label>
        <input type="email" name="email" placeholder="Entrez votre email" required>
        <label>🔑 Mot de passe :</label>
        <input type="password" name="password" placeholder="Choisissez un mot de passe" required>
        <button type="submit">✅ S'inscrire</button>
    </form>
    <div class="extra-links">
        <a href="/login">🔐 Déjà un compte ? Se connecter</a>
    </div>
</div>
</body>
</html>
