<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inscription — StageMaroc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/dist/tabler-icons.min.css">
    <style>
        :root {
            --green-dark:#0f4c2a; --green-mid:#1a6b3c; --green-light:#e8f5ee;
            --gold:#c9a84c; --gold-light:#f0d080;
            --bg:#f0f4f1; --border:#e2ece5; --text:#374151; --muted:#9ca3af;
            --font-head:'Sora',sans-serif; --font-body:'DM Sans',sans-serif;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body {
            font-family:var(--font-body);
            background:var(--green-dark);
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            position:relative; overflow-x:hidden; padding:20px 0;
        }
        body::before {
            content:''; position:absolute; inset:0;
            background-image:
                    radial-gradient(circle at 20% 20%, rgba(201,168,76,0.12) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(26,107,60,0.4) 0%, transparent 50%);
            pointer-events:none;
        }
        .auth-wrap {
            position:relative; z-index:1;
            display:flex; align-items:center; gap:60px; padding:20px;
        }
        .brand-panel {
            display:flex; flex-direction:column; align-items:flex-start;
            color:white; max-width:300px;
        }
        .brand-logo {
            width:52px; height:52px; border-radius:14px;
            background:var(--gold); display:flex; align-items:center;
            justify-content:center; color:var(--green-dark);
            font-size:24px; margin-bottom:20px;
        }
        .brand-panel h1 {
            font-family:var(--font-head); font-size:30px; font-weight:600;
            color:var(--gold-light); line-height:1.2; margin-bottom:12px;
        }
        .brand-panel p { font-size:14px; color:rgba(255,255,255,0.6); line-height:1.7; }
        .brand-features { margin-top:24px; display:flex; flex-direction:column; gap:10px; }
        .feat { display:flex; align-items:center; gap:10px; font-size:13px; color:rgba(255,255,255,0.7); }
        .feat-dot { width:6px; height:6px; border-radius:50%; background:var(--gold); flex-shrink:0; }

        .auth-card {
            background:#fff; border:1px solid var(--border); border-radius:20px;
            padding:36px 34px; width:420px;
            box-shadow:0 24px 60px rgba(0,0,0,0.25);
        }
        .card-logo {
            width:48px; height:48px; border-radius:12px;
            background:var(--green-dark); display:flex; align-items:center;
            justify-content:center; color:var(--gold); font-size:22px;
            margin:0 auto 16px;
        }
        .auth-card h2 {
            font-family:var(--font-head); text-align:center;
            font-size:20px; font-weight:600; color:var(--green-dark); margin-bottom:4px;
        }
        .sub { text-align:center; font-size:13px; color:var(--muted); margin-bottom:24px; }

        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .a-label {
            display:block; font-size:11px; font-weight:600; color:var(--green-mid);
            text-transform:uppercase; letter-spacing:0.8px; margin-bottom:5px;
        }
        .a-input {
            width:100%; padding:10px 13px; margin-bottom:14px;
            border:1.5px solid var(--border); border-radius:9px;
            font-size:14px; color:var(--text); background:#f9fafb;
            font-family:var(--font-body); transition:border-color 0.2s, background 0.2s;
        }
        .a-input:focus { border-color:var(--green-mid); outline:none; background:#fff; }
        .a-btn {
            width:100%; padding:12px; background:var(--green-dark); color:#fff;
            border:none; border-radius:9px; font-size:14px; font-weight:600;
            cursor:pointer; font-family:var(--font-body); margin-top:2px; margin-bottom:16px;
            transition:background 0.2s;
        }
        .a-btn:hover { background:var(--green-mid); }
        .alert-error {
            background:#fee2e2; color:#991b1b;
            padding:9px 13px; border-radius:8px;
            font-size:13px; margin-bottom:16px;
            display:flex; align-items:center; gap:7px;
        }
        .a-footer { text-align:center; font-size:13px; color:var(--muted); margin-top:4px; }
        .a-footer a { color:var(--green-mid); font-weight:600; text-decoration:none; }
        .a-footer a:hover { text-decoration:underline; }

        @media (max-width:700px) {
            .brand-panel { display:none; }
            .auth-wrap { justify-content:center; }
            .auth-card { width:100%; max-width:420px; }
        }
    </style>
</head>
<body>
<div class="auth-wrap">
    <div class="brand-panel">
        <div class="brand-logo"><i class="ti ti-plant-2"></i></div>
        <h1>Rejoignez StageMaroc</h1>
        <p>Créez votre profil étudiant et accédez aux meilleures offres de stage au Maroc.</p>
        <div class="brand-features">
            <div class="feat"><div class="feat-dot"></div> Inscription gratuite</div>
            <div class="feat"><div class="feat-dot"></div> Postulez en quelques clics</div>
            <div class="feat"><div class="feat-dot"></div> Suivi en temps réel</div>
        </div>
    </div>

    <div class="auth-card">
        <div class="card-logo"><i class="ti ti-user-plus"></i></div>
        <h2>Créer un compte</h2>
        <p class="sub">Rejoignez la plateforme StageMaroc</p>

        <div class="alert-error" th:if="${error}">
            <i class="ti ti-alert-circle" style="font-size:15px"></i>
            <span th:text="${error}"></span>
        </div>

        <form action="/register" method="post">
            <div class="form-row">
                <div>
                    <label class="a-label">Nom</label>
                    <input class="a-input" type="text" name="nom" placeholder="Votre nom" required>
                </div>
                <div>
                    <label class="a-label">Prénom</label>
                    <input class="a-input" type="text" name="prenom" placeholder="Votre prénom" required>
                </div>
            </div>
            <label class="a-label">Email</label>
            <input class="a-input" type="email" name="email" placeholder="votre@email.com" required>
            <label class="a-label">Mot de passe</label>
            <input class="a-input" type="password" name="password" placeholder="Choisissez un mot de passe" required>
            <button class="a-btn" type="submit">
                <i class="ti ti-user-plus" style="font-size:15px;margin-right:6px"></i>S'inscrire
            </button>
        </form>

        <div class="a-footer">Déjà un compte ? <a href="/login">Se connecter</a></div>
    </div>
</div>
</body>
</html>
