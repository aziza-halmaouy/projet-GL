<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Offres de stage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .container {
            width: 70%;
            margin: auto;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0px 3px 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        .card h3 {
            color: #2b6cb0;
            margin-bottom: 12px;
            font-size: 20px;
        }

        .card p {
            margin: 8px 0;
            color: #444;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background-color: #43a047;
        }

        /* QR CENTRÉ */
        .qr {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr img {
            width: 170px;
            height: 170px;
            border: 4px solid white;
            border-radius: 8px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.2);
        }

        .qr-text {
            font-size: 14px;
            margin-top: 10px;
            color: #333;
        }

        .site-link {
            margin-top: 6px;
            font-size: 13px;
            color: #2b6cb0;
            text-decoration: none;
            display: block;
        }

        .site-link:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

<h1>📋 Liste des stages</h1>

<div class="container">

    <div th:each="i : ${internships}" class="card">

        <h3>💼 <span th:text="${i.title}"></span></h3>

        <p><strong>🏢 Entreprise :</strong> <span th:text="${i.company}"></span></p>
        <p><strong>📍 Lieu :</strong> <span th:text="${i.location}"></span></p>
        <p><strong>⏳ Durée :</strong> <span th:text="${i.duration}"></span></p>

        <!-- ✅ DESCRIPTION DYNAMIQUE -->
        <p><strong>📝 Description :</strong>
            <span th:text="${i.description}"></span>
        </p>

        <!-- LIEN SITE -->
        <a class="site-link"
           th:href="${i.website != null ? i.website : 'https://example.com'}"
           target="_blank">
            🌐 Visiter site officiel
        </a>

        <!-- QR CODE CENTRÉ -->
        <div class="qr">

            <img th:src="'data:image/png;base64,' + ${qrService.generateQRCode(i.website != null ? i.website : 'https://example.com')}"/>

            <div class="qr-text">
                📱 Scanner le code QR pour visiter le site officiel de l’entreprise
            </div>

        </div>

        <a th:href="@{'/postuler/' + ${i.id}}" class="btn">🚀 Postuler</a>

    </div>

</div>

</body>
</html>
