name: CI/CD Pipeline

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # Backend (Java + Maven)
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build backend with Maven
      run: mvn -B package --file gestion-stages-maroc/pom.xml

    - name: Run backend tests
      run: mvn test --file gestion-stages-maroc/pom.xml

    # Frontend (Node.js)
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install frontend dependencies
      run: |
        cd gestion-stages-maroc/src/main/resources/static
        npm install

    - name: Build frontend
      run: |
        cd gestion-stages-maroc/src/main/resources/static
        npm run build
