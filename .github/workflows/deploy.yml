name: Build Spring Boot for Railway

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code
      - name: Checkout
        uses: actions/checkout@v3

      # Étape 2 : Installer JDK 21 avec Temurin
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Étape 3 : Compiler avec Maven
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests
        working-directory: gestion-stages-maroc
